  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">几何为教学示意，不按真实雷达参数；“约五分钟 / 约九万米”依据已接受 claim-radar-midway-detected，属当日具体记录。</text>
