  <title id="ttl">珍珠港：夏威夷与中太平洋位置（示意）</title>
  <desc id="desc">日本本土—夏威夷—中途岛的相对位置，以及瓦胡岛与珍珠港的放大示意　—　不按精确比例</desc>
