  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">位置与距离标注为教学示意，不按精确比例。“约 1,100 英里”与已接受内容中“中途岛距夏威夷约一千一百英里”一致。</text>
