<text x="600" y="476" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="middle" opacity="1">补给线越长，可用兵力与出击节奏越受限制（示意）</text>
  <rect x="60" y="624" width="684" height="44" rx="8" fill="#fbf7ea" stroke="#c9b995" stroke-width="1.5" opacity="0.92"/><line x1="78" y1="645" x2="108" y2="645" stroke="#2f5d8a" stroke-width="4" opacity="1" marker-end="url(#arrNavy)"/><text x="116" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">物资前送（示意）</text><line x1="408" y1="645" x2="438" y2="645" stroke="#a8894f" stroke-width="4" opacity="1" marker-end="url(#arrBrass)"/><text x="446" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">油料 / 弹药补给（示意）</text>
  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">流程与约束为教学简化；补给限制与资源依赖的基本事实见 concept-logistics 正文与已接受来源。</text>
