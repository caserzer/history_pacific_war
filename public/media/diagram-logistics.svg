  <text x="60" y="106" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="17" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">从后方基地到舰队的补给链条与主要约束　—　流程为教学简化</text>
