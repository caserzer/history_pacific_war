  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">依据已接受 battle-pearl-harbor 的三阶段时间与位置数据，以及 ONI/USSBS 珍珠港战史绘制。所有舰位、航线与地物位置均为教学示意，不是精确历史航迹或真实地理测绘。</text>
