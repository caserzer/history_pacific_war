  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">国界、资源地与箭头均为教学示意，不是精确地理或经济数据图。资源依赖与禁运的基本事实见已接受 content/history.json 的来源与 claims。</text>
