  <text x="60" y="106" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="17" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">日本的资源依赖、美国的经济制裁与双方的战略选择　—　国家轮廓与箭头均为教学示意</text>
