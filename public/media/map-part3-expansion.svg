<circle cx="800" cy="556" r="7" fill="#8b2c2c" stroke="none" stroke-width="0" opacity="1"/><text x="814" y="561" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">达尔文 1942-02-19</text>
<circle cx="322" cy="514" r="7" fill="#8b2c2c" stroke="none" stroke-width="0" opacity="1"/><text x="336" y="519" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">印度洋 1942-04</text>
<text x="200" y="560" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="12" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">箭头仅表示方向与先后，不代表精确航迹。</text>
  <rect x="60" y="624" width="684" height="44" rx="8" fill="#fbf7ea" stroke="#c9b995" stroke-width="1.5" opacity="0.92"/><line x1="78" y1="645" x2="108" y2="645" stroke="#8b2c2c" stroke-width="4" opacity="1" marker-end="url(#arrRed)"/><text x="116" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">日军进攻 / 占领方向（示意）</text><rect x="408" y="638" width="26" height="14" rx="3" fill="#8b2c2c" stroke="#8b2c2c" stroke-width="2" opacity="1"/><text x="446" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">主要目标</text>
  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">各战役的日期与结果见已接受内容；本图只作方向与先后的空间示意，箭头不代表精确航线或兵力规模。</text>
  <text x="1140" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="end" opacity="1">原创示意图 · 示意性标注</text>
</svg>
