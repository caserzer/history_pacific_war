<circle cx="862" cy="296" r="7" fill="#8b2c2c" stroke="none" stroke-width="0" opacity="1"/><text x="876" y="301" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">关岛 1941-12</text>
<circle cx="560" cy="424" r="7" fill="#8b2c2c" stroke="none" stroke-width="0" opacity="1"/><text x="574" y="429" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">香港 1941-12</text>
<circle cx="706" cy="438" r="7" fill="#8b2c2c" stroke="none" stroke-width="0" opacity="1"/><text x="720" y="443" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">菲律宾 1941-12—1942-05</text>
<circle cx="470" cy="502" r="7" fill="#8b2c2c" stroke="none" stroke-width="0" opacity="1"/><text x="484" y="507" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">马来亚 / 新加坡 1941-12—1942-02</text>
