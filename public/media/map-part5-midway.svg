<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">中途岛：北太平洋的前哨与战略位置（示意）</title>
  <desc id="desc">中途岛、夏威夷、日本本土与阿留申方向；虚线圈为日方计划中的空中掩护半径示意　—　不按比例</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ddd0b4" stroke-width="1"/></pattern>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b2c2c"/></marker><marker id="arrNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="arrBrass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8894f"/></marker><marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6b4a"/></marker><marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b604d"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4ecd8"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.55"/>
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#1f3a5f" stroke-width="3"/>
  <rect x="29" y="29" width="1142" height="742" fill="none" stroke="#a8894f" stroke-width="1.2"/>
  <text x="60" y="74" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="33" font-weight="700" fill="#1f3a5f" text-anchor="start" opacity="1">中途岛：北太平洋的前哨与战略位置（示意）</text>
  <text x="60" y="106" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="17" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">中途岛、夏威夷、日本本土与阿留申方向；虚线圈为日方计划中的空中掩护半径示意　—　不按比例</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#a8894f" stroke-width="2" opacity="1"/>
  <text x="1140" y="74" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="700" fill="#a8894f" text-anchor="end" opacity="1">DSH · 太平洋战争教材</text>
  <rect x="70" y="140" width="1060" height="455" rx="2" fill="#e9eef2" stroke="none" stroke-width="0" opacity="1"/>
<circle cx="520" cy="400" r="250" fill="none" stroke="#a8894f" stroke-width="2" opacity="0.85"/>
<text x="520" y="168" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#a8894f" text-anchor="middle" opacity="1">日方计划中的约 1,300 英里空中掩护半径（示意，不按比例）</text>
<circle cx="520" cy="400" r="14" fill="#e8dcbf" stroke="#22303f" stroke-width="2" opacity="1"/>
<text x="520" y="440" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="16" font-weight="700" fill="#22303f" text-anchor="middle" opacity="1">中途岛</text>
<circle cx="760" cy="430" r="11" fill="#2f5d8a" stroke="none" stroke-width="0" opacity="1"/>
<text x="760" y="462" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="600" fill="#2f5d8a" text-anchor="middle" opacity="1">夏威夷</text>
<rect x="110" y="236" width="130" height="62" rx="8" fill="#f3ddd2" stroke="#8b2c2c" stroke-width="2" opacity="1"/>
<text x="175" y="272" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="700" fill="#8b2c2c" text-anchor="middle" opacity="1">日本本土</text>
<circle cx="520" cy="196" r="9" fill="#6b604d" stroke="none" stroke-width="0" opacity="1"/>
<text x="520" y="180" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="12" font-weight="400" fill="#6b604d" text-anchor="middle" opacity="1">阿留申群岛方向</text>
<line x1="246" y1="274" x2="496" y2="388" stroke="#8b2c2c" stroke-width="3" opacity="1" stroke-dasharray="9 6" marker-end="url(#arrRed)"/>
<text x="300" y="342" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#8b2c2c" text-anchor="start" opacity="1">日军进攻方向（示意）</text>
<line x1="568" y1="402" x2="726" y2="424" stroke="#a8894f" stroke-width="2.5" opacity="1" stroke-dasharray="6 4" marker-end="url(#arrBrass)"/>
<text x="612" y="388" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="700" fill="#a8894f" text-anchor="start" opacity="1">约 1,100 英里</text>
<text x="520" y="500" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#22303f" text-anchor="middle" opacity="1">中途岛是美军在北太平洋的前哨；它使夏威夷方向获得预警纵深。</text>
  <rect x="60" y="624" width="684" height="70" rx="8" fill="#fbf7ea" stroke="#c9b995" stroke-width="1.5" opacity="0.92"/><line x1="78" y1="645" x2="108" y2="645" stroke="#8b2c2c" stroke-width="4" opacity="1" marker-end="url(#arrRed)"/><text x="116" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">日军进攻方向（示意）</text><line x1="408" y1="645" x2="438" y2="645" stroke="#a8894f" stroke-width="4" opacity="1" marker-end="url(#arrBrass)"/><text x="446" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">中途岛—夏威夷（约 1,100 英里）</text><line x1="78" y1="671" x2="104" y2="671" stroke="#a8894f" stroke-width="4" opacity="1" stroke-dasharray="10 7"/><text x="116" y="676" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">约 1,300 英里空中掩护半径（示意）</text>
  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">圆圈为教学示意，不按精确比例；1,300 英里半径与 1,100 英里的距离数值依据已接受内容与 USSBS 第 5 章。</text>
  <text x="1140" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="end" opacity="1">原创示意图 · 示意性标注</text>
</svg>
