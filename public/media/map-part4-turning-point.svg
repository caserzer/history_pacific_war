<rect x="150" y="460" width="330" height="46" rx="6" fill="#fbf7ea" stroke="#22303f" stroke-width="1.5" opacity="1"/>
<text x="168" y="488" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">中途岛 1942-06：日军损失四艘航母</text>
  <rect x="60" y="624" width="684" height="70" rx="8" fill="#fbf7ea" stroke="#c9b995" stroke-width="1.5" opacity="0.92"/><line x1="78" y1="645" x2="108" y2="645" stroke="#8b2c2c" stroke-width="4" opacity="1" marker-end="url(#arrRed)"/><text x="116" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">日军进攻方向（示意）</text><line x1="408" y1="645" x2="438" y2="645" stroke="#2f5d8a" stroke-width="4" opacity="1" marker-end="url(#arrNavy)"/><text x="446" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">美军航母兵力投入（示意）</text><rect x="78" y="664" width="26" height="14" rx="3" fill="#a8894f" stroke="#a8894f" stroke-width="2" opacity="1"/><text x="116" y="676" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">关键港口</text>
  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">本图只表示两条战略方向的相对位置与先后，不表示精确航迹、兵力或时间。战役经过与损失见已接受内容。</text>
  <text x="1140" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="end" opacity="1">原创示意图 · 示意性标注</text>
</svg>
