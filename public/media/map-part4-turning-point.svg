<circle cx="722" cy="516" r="9" fill="#a8894f" stroke="none" stroke-width="0" opacity="1"/>
<text x="738" y="522" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">莫尔兹比港</text>
<circle cx="140" cy="380" r="9" fill="#2f5d8a" stroke="none" stroke-width="0" opacity="1"/>
<text x="156" y="386" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#2f5d8a" text-anchor="start" opacity="1">夏威夷</text>
<circle cx="300" cy="210" r="9" fill="#22303f" stroke="none" stroke-width="0" opacity="1"/>
<text x="316" y="216" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="start" opacity="1">中途岛</text>
<circle cx="626" cy="470" r="10" fill="#2f5d8a" stroke="none" stroke-width="0" opacity="1"/>
