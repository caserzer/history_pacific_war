<line x1="770" y1="452" x2="800" y2="486" stroke="#8b2c2c" stroke-width="3" opacity="1"/>
<line x1="800" y1="452" x2="770" y2="486" stroke="#8b2c2c" stroke-width="3" opacity="1"/>
<text x="806" y="476" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="12" font-weight="400" fill="#8b2c2c" text-anchor="start" opacity="1">进攻受阻</text>
<line x1="936" y1="206" x2="322" y2="206" stroke="#8b2c2c" stroke-width="3" opacity="1" stroke-dasharray="9 6" marker-end="url(#arrRed)"/>
<text x="600" y="192" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#8b2c2c" text-anchor="start" opacity="1">日军进攻中途岛方向（示意）</text>
<line x1="190" y1="372" x2="600" y2="460" stroke="#2f5d8a" stroke-width="3" opacity="1" stroke-dasharray="8 5" marker-end="url(#arrNavy)"/>
<text x="340" y="448" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#2f5d8a" text-anchor="start" opacity="1">美军航母兵力投入（示意）</text>
