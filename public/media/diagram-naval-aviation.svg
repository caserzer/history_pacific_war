<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">海军航空作战循环：搜索—攻击—回收—整备（原创）</title>
  <desc id="desc">航母打击能力依赖一条可被时间打断的循环　—　流程为教学简化</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ddd0b4" stroke-width="1"/></pattern>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b2c2c"/></marker><marker id="arrNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="arrBrass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8894f"/></marker><marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6b4a"/></marker><marker id="arrMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b604d"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f4ecd8"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.55"/>
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#1f3a5f" stroke-width="3"/>
  <rect x="29" y="29" width="1142" height="742" fill="none" stroke="#a8894f" stroke-width="1.2"/>
  <text x="60" y="74" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="33" font-weight="700" fill="#1f3a5f" text-anchor="start" opacity="1">海军航空作战循环：搜索—攻击—回收—整备（原创）</text>
  <text x="60" y="106" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="17" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">航母打击能力依赖一条可被时间打断的循环　—　流程为教学简化</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#a8894f" stroke-width="2" opacity="1"/>
  <text x="1140" y="74" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="700" fill="#a8894f" text-anchor="end" opacity="1">DSH · 太平洋战争教材</text>
  <rect x="510" y="172" width="180" height="56" rx="8" fill="#fbf7ea" stroke="#2f5d8a" stroke-width="2" opacity="1"/><text x="600" y="206" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="15" font-weight="600" fill="#1f3a5f" text-anchor="middle" opacity="1">侦察 / 搜索</text>
<rect x="760" y="272" width="180" height="56" rx="8" fill="#fbf7ea" stroke="#2f5d8a" stroke-width="2" opacity="1"/><text x="850" y="306" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="15" font-weight="600" fill="#1f3a5f" text-anchor="middle" opacity="1">发现目标</text>
<rect x="760" y="442" width="180" height="56" rx="8" fill="#fbf7ea" stroke="#2f5d8a" stroke-width="2" opacity="1"/><text x="850" y="476" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="15" font-weight="600" fill="#1f3a5f" text-anchor="middle" opacity="1">出动攻击</text>
<rect x="510" y="532" width="180" height="56" rx="8" fill="#fbf7ea" stroke="#2f5d8a" stroke-width="2" opacity="1"/><text x="600" y="566" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="15" font-weight="600" fill="#1f3a5f" text-anchor="middle" opacity="1">返航回收</text>
<rect x="260" y="442" width="180" height="56" rx="8" fill="#fbf7ea" stroke="#2f5d8a" stroke-width="2" opacity="1"/><text x="350" y="476" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="15" font-weight="600" fill="#1f3a5f" text-anchor="middle" opacity="1">加油挂弹整备</text>
<rect x="260" y="272" width="180" height="56" rx="8" fill="#fbf7ea" stroke="#2f5d8a" stroke-width="2" opacity="1"/><text x="350" y="306" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="15" font-weight="600" fill="#1f3a5f" text-anchor="middle" opacity="1">再次出动</text>
<line x1="690" y1="214" x2="760" y2="268" stroke="#2f5d8a" stroke-width="3" opacity="1" marker-end="url(#arrNavy)"/>
<line x1="850" y1="328" x2="850" y2="442" stroke="#2f5d8a" stroke-width="3" opacity="1" marker-end="url(#arrNavy)"/>
<line x1="760" y1="486" x2="690" y2="540" stroke="#2f5d8a" stroke-width="3" opacity="1" marker-end="url(#arrNavy)"/>
<line x1="510" y1="540" x2="440" y2="486" stroke="#2f5d8a" stroke-width="3" opacity="1" marker-end="url(#arrNavy)"/>
<line x1="350" y1="442" x2="350" y2="328" stroke="#2f5d8a" stroke-width="3" opacity="1" marker-end="url(#arrNavy)"/>
<line x1="440" y1="268" x2="510" y2="214" stroke="#a8894f" stroke-width="3" opacity="1" marker-end="url(#arrBrass)"/>
<rect x="470" y="330" width="260" height="100" rx="10" fill="#f7f1e2" stroke="#8b2c2c" stroke-width="2" opacity="1"/>
<text x="600" y="364" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="24" font-weight="700" fill="#8b2c2c" text-anchor="middle" opacity="1">时间差</text>
<text x="600" y="394" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="middle" opacity="1">出动约需一小时；</text>
<text x="600" y="414" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#22303f" text-anchor="middle" opacity="1">整备与回收同样消耗时间。</text>
<text x="600" y="470" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="middle" opacity="1">谁先完成“发现—出动—攻击”的循环，</text>
<text x="600" y="490" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="middle" opacity="1">谁就更可能先出手。</text>
  <rect x="60" y="624" width="684" height="44" rx="8" fill="#fbf7ea" stroke="#c9b995" stroke-width="1.5" opacity="0.92"/><line x1="78" y1="645" x2="108" y2="645" stroke="#2f5d8a" stroke-width="4" opacity="1" marker-end="url(#arrNavy)"/><text x="116" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">作战循环（示意）</text><line x1="408" y1="645" x2="438" y2="645" stroke="#a8894f" stroke-width="4" opacity="1" marker-end="url(#arrBrass)"/><text x="446" y="650" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="14" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">再次出动（示意）</text>
  <text x="60" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="start" opacity="1">流程为教学简化，不表示所有战斗都按同一顺序发生；时间成本与整备约束见 concept-naval-aviation 与已接受 claims。</text>
  <text x="1140" y="758" font-family="'Noto Serif SC','Songti SC',Georgia,serif" font-size="13" font-weight="400" fill="#6b604d" text-anchor="end" opacity="1">原创示意图 · 示意性标注</text>
</svg>
